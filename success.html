<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Purchase successful — µ micro</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      background: #0a0a0a;
      color: #e5e5e5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .card {
      max-width: 520px;
      width: 100%;
      background: #111;
      border: 1px solid #222;
      border-radius: 12px;
      padding: 2.5rem;
      text-align: center;
    }

    .icon {
      font-size: 2.5rem;
      margin-bottom: 1.25rem;
    }

    h1 {
      font-size: 1.4rem;
      font-weight: 600;
      color: #fff;
      margin-bottom: 0.6rem;
    }

    .tool-name {
      font-family: monospace;
      font-size: 1rem;
      color: #888;
      margin-bottom: 1.75rem;
    }

    .steps {
      text-align: left;
      background: #0d0d0d;
      border: 1px solid #1e1e1e;
      border-radius: 8px;
      padding: 1.25rem 1.5rem;
      margin-bottom: 1.75rem;
    }

    .steps p {
      font-size: 0.875rem;
      color: #aaa;
      line-height: 1.7;
    }

    .steps strong {
      color: #e5e5e5;
    }

    .steps a {
      color: #7c9ef8;
      text-decoration: none;
    }

    .steps a:hover {
      text-decoration: underline;
    }

    .back {
      display: inline-block;
      margin-top: 0.25rem;
      font-size: 0.8rem;
      color: #555;
      text-decoration: none;
      transition: color 0.15s;
    }

    .back:hover { color: #888; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">✓</div>
    <h1>Payment successful</h1>
    <p class="tool-name" id="tool-label">µ micro</p>

    <div class="steps">
      <p>
        <strong>Your receipt</strong> is on its way from Stripe.<br /><br />
        <strong>To get your tool:</strong> reply to the receipt email or email
        <a href="mailto:anishpunati@gmail.com">anishpunati@gmail.com</a>
        with your order — you'll get GitHub access within a few hours.<br /><br />
        <strong>Questions?</strong> Same address.
      </p>
    </div>

    <a class="back" href="/">← back to µ micro</a>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const tool = params.get('tool');
    if (tool) {
      document.getElementById('tool-label').textContent = tool;
      document.title = `${tool} — purchase successful`;
    }
  </script>
</body>
</html>
