<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>µ — microtools by anish punati</title>
  <meta name="description" content="A growing collection of small tools that solve one problem well." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #F4F3EF;
      --surface:   #FDFCF8;
      --ink:       #1A1917;
      --muted:     #9A9790;
      --accent:    #C8410A;
      --border:    #E2E0D8;
      --mono:      'JetBrains Mono', monospace;
      --serif:     'Instrument Serif', Georgia, serif;
    }

    html { font-size: 16px; }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: var(--mono);
      min-height: 100vh;
      padding: 0 clamp(1.5rem, 5vw, 4rem);
    }

    /* ── Header ── */
    header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      padding: 3.5rem 0 1.25rem;
      border-bottom: 1px solid var(--border);
    }

    .brand {
      font-family: var(--serif);
      font-size: clamp(2.8rem, 6vw, 4.5rem);
      line-height: 1;
      letter-spacing: -0.02em;
      color: var(--ink);
      text-decoration: none;
    }

    .brand em {
      font-style: italic;
      color: var(--accent);
    }

    nav {
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }

    nav a {
      color: inherit;
      text-decoration: none;
      margin-left: 1.5rem;
      transition: color 0.15s;
    }
    nav a:hover { color: var(--ink); }

    /* ── Subscription banner ── */
    .sub-banner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1rem;
      background: var(--ink);
      color: var(--bg);
      padding: 1rem 1.5rem;
      border-radius: 3px;
      margin-bottom: 3rem;
    }

    .sub-label {
      font-family: var(--serif);
      font-style: italic;
      color: var(--accent);
      margin-right: .75rem;
    }

    .sub-banner-text {
      font-size: .75rem;
      letter-spacing: .03em;
      opacity: .9;
    }

    .sub-cta {
      background: var(--accent);
      color: var(--bg);
      text-decoration: none;
      padding: .5rem 1.25rem;
      border-radius: 2px;
      font-size: .72rem;
      letter-spacing: .06em;
      white-space: nowrap;
      transition: opacity .15s;
      flex-shrink: 0;
    }

    .sub-cta:hover { opacity: .85; }

    /* ── Tagline ── */
    .tagline {
      padding: 1.5rem 0 2rem;
      font-family: var(--serif);
      font-size: clamp(1rem, 2.2vw, 1.2rem);
      font-style: italic;
      color: var(--muted);
      letter-spacing: 0.01em;
    }

    /* ── Stats bar ── */
    .stats {
      display: flex;
      gap: 2.5rem;
      margin-bottom: 3rem;
      padding-bottom: 2rem;
      border-bottom: 1px solid var(--border);
      font-size: 0.72rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .stats strong {
      display: block;
      font-family: var(--serif);
      font-size: 2rem;
      font-style: italic;
      letter-spacing: -0.02em;
      color: var(--ink);
      margin-bottom: 0.1rem;
      text-transform: none;
    }

    /* ── Grid ── */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr));
      gap: 1.5rem;
      padding-bottom: 5rem;
    }

    /* ── Card ── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 3px;
      padding: 1.75rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      transition: border-color 0.15s, box-shadow 0.15s, transform 0.15s;
      position: relative;
      overflow: hidden;
      cursor: pointer;
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: var(--accent);
      transform: scaleX(0);
      transform-origin: left;
      transition: transform 0.2s ease;
    }

    .card:hover {
      border-color: #C8C6BC;
      box-shadow: 0 4px 24px rgba(0,0,0,0.06);
      transform: translateY(-2px);
    }

    .card:hover::before { transform: scaleX(1); }

    .card-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.68rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .card-category {
      background: var(--bg);
      padding: 0.2rem 0.5rem;
      border-radius: 2px;
      border: 1px solid var(--border);
    }

    .card-name {
      font-family: var(--serif);
      font-size: 1.45rem;
      line-height: 1.2;
      letter-spacing: -0.01em;
      color: var(--ink);
    }

    .card-desc {
      font-size: 0.78rem;
      line-height: 1.6;
      color: #5C5A55;
      flex: 1;
    }

    .card-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
    }

    .tag {
      font-size: 0.65rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--muted);
      background: var(--bg);
      border: 1px solid var(--border);
      padding: 0.15rem 0.45rem;
      border-radius: 2px;
    }

    .card-links {
      display: flex;
      gap: 0.75rem;
      align-items: center;
      padding-top: 0.5rem;
      border-top: 1px solid var(--border);
      flex-wrap: wrap;
    }

    .link {
      font-size: 0.7rem;
      letter-spacing: 0.04em;
      text-decoration: none;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 0.3rem;
      transition: color 0.15s;
    }

    .link:hover { color: var(--ink); }

    .link-buy {
      margin-left: auto;
      background: var(--ink);
      color: var(--bg) !important;
      padding: 0.3rem 0.75rem;
      border-radius: 2px;
      transition: background 0.15s !important;
    }

    .link-buy:hover { background: var(--accent) !important; }

    .link-sub {
      background: transparent;
      color: var(--accent) !important;
      border: 1px solid var(--accent);
      padding: 0.3rem 0.75rem;
      border-radius: 2px;
      transition: background 0.15s, color 0.15s !important;
    }

    .link-sub:hover {
      background: var(--accent) !important;
      color: var(--bg) !important;
    }

    /* ── Detail Modal ── */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(26, 25, 23, 0.7);
      backdrop-filter: blur(4px);
      z-index: 100;
      padding: clamp(1rem, 5vw, 3rem);
      overflow-y: auto;
      align-items: flex-start;
      justify-content: center;
    }

    .modal-overlay.open {
      display: flex;
    }

    .modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 4px;
      width: 100%;
      max-width: 680px;
      margin: auto;
      position: relative;
      overflow: hidden;
    }

    .modal::before {
      content: '';
      display: block;
      height: 3px;
      background: var(--accent);
    }

    .modal-header {
      padding: 2rem 2rem 1.25rem;
      border-bottom: 1px solid var(--border);
    }

    .modal-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.68rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 0.75rem;
    }

    .modal-close {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--muted);
      font-size: 1.1rem;
      padding: 0;
      line-height: 1;
      transition: color 0.15s;
    }

    .modal-close:hover { color: var(--ink); }

    .modal-title {
      font-family: var(--serif);
      font-size: clamp(1.6rem, 4vw, 2.2rem);
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--ink);
      margin-bottom: 0.5rem;
    }

    .modal-desc {
      font-size: 0.8rem;
      line-height: 1.65;
      color: #5C5A55;
    }

    .modal-body {
      padding: 1.75rem 2rem;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .modal-section {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .modal-section-label {
      font-size: 0.65rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--accent);
      font-weight: 500;
    }

    .modal-section-text {
      font-size: 0.82rem;
      line-height: 1.7;
      color: var(--ink);
    }

    .modal-divider {
      height: 1px;
      background: var(--border);
    }

    .modal-footer {
      padding: 1.25rem 2rem;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 0.75rem;
      align-items: center;
      flex-wrap: wrap;
    }

    .modal-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
      flex: 1;
    }

    .modal-actions {
      display: flex;
      gap: 0.65rem;
      align-items: center;
      flex-wrap: wrap;
    }

    .btn {
      font-family: var(--mono);
      font-size: 0.72rem;
      letter-spacing: 0.05em;
      text-decoration: none;
      padding: 0.55rem 1.1rem;
      border-radius: 2px;
      white-space: nowrap;
      transition: background 0.15s, color 0.15s, opacity 0.15s;
      cursor: pointer;
      border: none;
    }

    .btn-primary {
      background: var(--ink);
      color: var(--bg);
    }

    .btn-primary:hover { background: var(--accent); }

    .btn-outline {
      background: transparent;
      color: var(--accent);
      border: 1px solid var(--accent);
    }

    .btn-outline:hover {
      background: var(--accent);
      color: var(--bg);
    }

    .btn-ghost {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--border);
    }

    .btn-ghost:hover { color: var(--ink); border-color: var(--ink); }

    /* ── Empty state ── */
    .empty {
      grid-column: 1 / -1;
      padding: 5rem 0;
      text-align: center;
      color: var(--muted);
    }

    .empty .glyph {
      font-family: var(--serif);
      font-size: 5rem;
      font-style: italic;
      display: block;
      margin-bottom: 1rem;
      opacity: 0.3;
    }

    .empty p {
      font-size: 0.8rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    /* ── Footer ── */
    footer {
      border-top: 1px solid var(--border);
      padding: 2rem 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.68rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--muted);
    }

    footer a { color: inherit; text-decoration: none; }
    footer a:hover { color: var(--ink); }

    /* ── Skeleton loader ── */
    @keyframes shimmer {
      0%   { background-position: -600px 0; }
      100% { background-position: 600px 0; }
    }

    .skeleton {
      background: linear-gradient(90deg, var(--border) 25%, var(--bg) 50%, var(--border) 75%);
      background-size: 600px 100%;
      animation: shimmer 1.4s infinite linear;
      border-radius: 2px;
    }

    .card.loading .card-name,
    .card.loading .card-desc,
    .card.loading .card-meta { color: transparent; }

    .card.loading .card-name  { background: var(--border); border-radius: 2px; }

    /* ── Tap hint on cards ── */
    .card-hint {
      font-size: 0.62rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--muted);
      opacity: 0;
      transition: opacity 0.2s;
    }

    .card:hover .card-hint { opacity: 1; }
  </style>
</head>
<body>

<header>
  <a class="brand" href="/"><em>µ</em> micro</a>
  <nav>
    <a href="https://github.com/anishpunati" target="_blank" rel="noopener">GitHub ↗</a>
  </nav>
</header>

<p class="tagline">one problem. one tool. shipped daily.</p>

<div class="sub-banner">
  <div class="sub-banner-text">
    <span class="sub-label">µ micro Pass</span>
    Unlimited access to every tool, past and future — one flat rate.
  </div>
  <a href="https://buy.stripe.com/00w5kD9vngbzcXM8t377O03" id="subscribe-btn" class="sub-cta">Subscribe — $14.99 / month →</a>
</div>

<div class="stats">
  <div><strong id="stat-count">—</strong>tools built</div>
  <div><strong id="stat-latest">—</strong>last shipped</div>
  <div><strong id="stat-categories">—</strong>categories</div>
</div>

<main class="grid" id="grid">
  <!-- populated by JS -->
</main>

<!-- Detail Modal -->
<div class="modal-overlay" id="modal-overlay" role="dialog" aria-modal="true">
  <div class="modal" id="modal">
    <div class="modal-header">
      <div class="modal-meta">
        <span id="modal-cat"></span>
        <button class="modal-close" id="modal-close" aria-label="Close">✕</button>
      </div>
      <h2 class="modal-title" id="modal-title"></h2>
      <p class="modal-desc" id="modal-desc"></p>
    </div>
    <div class="modal-body" id="modal-body">
      <!-- sections injected by JS -->
    </div>
    <div class="modal-footer">
      <div class="modal-tags" id="modal-tags"></div>
      <div class="modal-actions" id="modal-actions"></div>
    </div>
  </div>
</div>

<footer>
  <span>µ micro · built by <a href="https://github.com/anishpunati">anish punati</a></span>
  <span id="footer-updated"></span>
</footer>

<script>
  const SUBSCRIPTION_URL = 'https://buy.stripe.com/00w5kD9vngbzcXM8t377O03';
  const MIN_PRICE = 2.99;

  const CATEGORY_LABELS = {
    cli:        'CLI',
    web:        'Web App',
    extension:  'Extension',
    bot:        'Bot',
    library:    'Library',
    template:   'Template',
    other:      'Other',
  };

  function formatDate(iso) {
    const d = new Date(iso);
    return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
  }

  function relativeDate(iso) {
    const diff = Date.now() - new Date(iso);
    const days = Math.floor(diff / 86400000);
    if (days === 0) return 'today';
    if (days === 1) return 'yesterday';
    if (days < 30) return `${days}d ago`;
    const months = Math.floor(days / 30);
    return `${months}mo ago`;
  }

  function displayPrice(tool) {
    const raw = parseFloat(tool.price);
    if (isNaN(raw) || raw <= 0) return null; // no price stored
    return `$${raw.toFixed(2)}`;
  }

  // Normalise field names — task writes slug/github/payUrl/npm;
  // legacy entries may use name/github_url/payment_url
  function normalise(t) {
    return {
      ...t,
      name:        t.name        || t.slug       || '(unnamed)',
      github_url:  t.github_url  || t.github     || null,
      npm_url:     t.npm_url     || t.npm        || null,
      live_url:    t.live_url                    || null,
      payment_url: t.payment_url || t.payUrl     || null,
    };
  }

  function renderCard(raw) {
    const tool = normalise(raw);
    const card = document.createElement('article');
    card.className = 'card';
    card.setAttribute('tabindex', '0');
    card.setAttribute('role', 'button');
    card.setAttribute('aria-label', `Open details for ${tool.name}`);

    const links = [];
    if (tool.live_url)   links.push(`<a class="link" href="${tool.live_url}"   target="_blank" rel="noopener" onclick="event.stopPropagation()">⊹ live</a>`);

    links.push(`<a class="link link-sub" href="${SUBSCRIPTION_URL}" target="_blank" rel="noopener" onclick="event.stopPropagation()">pass →</a>`);

    // Only show buy button if there's an actual price AND a dedicated payment link
    const price  = displayPrice(tool);
    const payUrl = tool.payment_url;
    if (price && payUrl) {
      links.push(`<a class="link link-buy" href="${payUrl}" target="_blank" rel="noopener" onclick="event.stopPropagation()">buy · ${price} →</a>`);
    }

    const tags = (tool.tags || []).map(t => `<span class="tag">${t}</span>`).join('');
    const cat  = CATEGORY_LABELS[tool.category] || tool.category || 'cli';

    card.innerHTML = `
      <div class="card-meta">
        <span class="card-category">${cat}</span>
        <span title="${formatDate(tool.date)}">${relativeDate(tool.date)}</span>
      </div>
      <h2 class="card-name">${tool.name}</h2>
      <p class="card-desc">${tool.description}</p>
      ${tags ? `<div class="card-tags">${tags}</div>` : ''}
      <div class="card-links">${links.join('')}</div>
      <span class="card-hint">click for details →</span>
    `;

    card.addEventListener('click', () => openDetail(raw));
    card.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openDetail(raw); } });

    return card;
  }

  function openDetail(raw) {
    const tool   = normalise(raw);
    const cat    = CATEGORY_LABELS[tool.category] || tool.category || 'cli';
    const price  = displayPrice(tool);
    const payUrl = tool.payment_url;

    document.getElementById('modal-cat').textContent   = `${cat} · ${formatDate(tool.date)}`;
    document.getElementById('modal-title').textContent = tool.name;
    document.getElementById('modal-desc').textContent  = tool.description;

    const body = document.getElementById('modal-body');
    body.innerHTML = '';

    const sections = [
      { label: 'Why this tool',  key: 'thought_process', fallback: 'No build notes were recorded for this tool.' },
      { label: 'The Problem',    key: 'problem'  },
      { label: 'The Solution',   key: 'solution' },
      { label: 'The Method',     key: 'method'   },
    ];

    let first = true;
    sections.forEach(({ label, key, fallback }) => {
      const text = tool[key] || (fallback && first && key === 'thought_process' ? fallback : null);
      if (!text) return;
      if (!first) {
        const div = document.createElement('div');
        div.className = 'modal-divider';
        body.appendChild(div);
      }
      first = false;
      const isPlaceholder = !tool[key];
      const sec = document.createElement('div');
      sec.className = 'modal-section';
      sec.innerHTML = `
        <span class="modal-section-label">${label}</span>
        <p class="modal-section-text"${isPlaceholder ? ' style="color:var(--muted);font-style:italic"' : ''}>${text}</p>
      `;
      body.appendChild(sec);
    });

    const tagsEl = document.getElementById('modal-tags');
    tagsEl.innerHTML = (tool.tags || []).map(t => `<span class="tag">${t}</span>`).join('');

    const actions = document.getElementById('modal-actions');
    actions.innerHTML = '';

    if (tool.live_url) {
      const a = document.createElement('a');
      a.className = 'btn btn-ghost';
      a.href = tool.live_url;
      a.target = '_blank';
      a.rel = 'noopener';
      a.textContent = '⊹ live demo';
      actions.appendChild(a);
    }

    const subBtn = document.createElement('a');
    subBtn.className = 'btn btn-outline';
    subBtn.href = SUBSCRIPTION_URL;
    subBtn.target = '_blank';
    subBtn.rel = 'noopener';
    subBtn.textContent = 'µ pass · $15/mo';
    actions.appendChild(subBtn);

    if (price && payUrl) {
      const buyBtn = document.createElement('a');
      buyBtn.className = 'btn btn-primary';
      buyBtn.href = payUrl;
      buyBtn.target = '_blank';
      buyBtn.rel = 'noopener';
      buyBtn.textContent = `buy · ${price}`;
      actions.appendChild(buyBtn);
    }

    const overlay = document.getElementById('modal-overlay');
    overlay.classList.add('open');
    document.body.style.overflow = 'hidden';
    document.getElementById('modal-close').focus();
  }

  function closeDetail() {
    document.getElementById('modal-overlay').classList.remove('open');
    document.body.style.overflow = '';
  }

  document.getElementById('modal-close').addEventListener('click', closeDetail);
  document.getElementById('modal-overlay').addEventListener('click', e => {
    if (e.target === document.getElementById('modal-overlay')) closeDetail();
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closeDetail();
  });

  function renderEmpty() {
    const el = document.createElement('div');
    el.className = 'empty';
    el.innerHTML = `<span class="glyph">µ</span><p>first tool ships tomorrow at 4 am</p>`;
    return el;
  }

  async function init() {
    const grid = document.getElementById('grid');

    try {
      const res   = await fetch('tools.json?v=' + Date.now());
      const tools = await res.json();

      document.getElementById('stat-count').textContent = tools.length;

      const sorted = [...tools].sort((a, b) => new Date(b.date) - new Date(a.date));
      const latest = sorted[0];
      document.getElementById('stat-latest').textContent = latest ? relativeDate(latest.date) : '—';

      const cats = new Set(tools.map(t => t.category).filter(Boolean));
      document.getElementById('stat-categories').textContent = cats.size || '—';

      document.getElementById('footer-updated').textContent =
        latest ? `last updated ${formatDate(latest.date)}` : '';

      if (tools.length === 0) {
        grid.appendChild(renderEmpty());
      } else {
        sorted.forEach(t => grid.appendChild(renderCard(t)));
      }
    } catch (e) {
      grid.appendChild(renderEmpty());
    }
  }

  init();
</script>
</body>
</html>
