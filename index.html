<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>µ micro — developer tools, shipped daily</title>
  <style>
    :root {
      --bg:          #efece7;
      --card:        #ffffff;
      --border:      #e0ddd7;
      --text:        #1c1a18;
      --muted:       #8a8680;
      --accent:      #c84724;
      --accent-dim:  #f5ede9;
      --chip-bg:     #e6e3dd;
      --black:       #1a1a1a;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh;
    }

    /* ── Header ──────────────────────────────────────────────────────── */
    header {
      padding: 48px 24px 28px;
      max-width: 1280px;
      margin: 0 auto;
    }
    .site-name {
      font-size: 32px;
      font-weight: 700;
      letter-spacing: -0.01em;
      color: var(--text);
    }
    .site-sub {
      font-size: 12px;
      color: var(--muted);
      margin-top: 4px;
      letter-spacing: 0.02em;
    }

    /* ── Controls ────────────────────────────────────────────────────── */
    .controls {
      max-width: 1280px;
      margin: 0 auto;
      padding: 0 24px 20px;
    }

    .search-input {
      width: 100%;
      padding: 10px 14px;
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 13px;
      font-family: 'SFMono-Regular', 'Consolas', 'Liberation Mono', monospace;
      outline: none;
      -webkit-appearance: none;
      appearance: none;
      margin-bottom: 14px;
    }
    .search-input::placeholder { color: var(--muted); }
    .search-input:focus { border-color: var(--accent); }

    .filter-row {
      display: flex;
      align-items: flex-start;
      gap: 6px 18px;
      flex-wrap: wrap;
    }
    .filter-group {
      display: flex;
      align-items: center;
      gap: 5px;
      flex-wrap: wrap;
    }
    .filter-label {
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
      white-space: nowrap;
      padding: 3px 0;
    }
    .chip {
      display: inline-block;
      padding: 2px 8px;
      background: var(--chip-bg);
      border: 1px solid transparent;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      cursor: pointer;
      user-select: none;
      transition: background 0.1s, color 0.1s, border-color 0.1s;
      line-height: 1.8;
    }
    .chip:hover { border-color: var(--accent); color: var(--accent); }
    .chip.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    .controls-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 12px;
      min-height: 18px;
    }
    .results-count {
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 0.04em;
    }
    .clear-btn {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--accent);
      cursor: pointer;
      background: none;
      border: none;
      padding: 0;
      text-decoration: underline;
      display: none;
    }

    /* ── Grid ────────────────────────────────────────────────────────── */
    .grid {
      max-width: 1280px;
      margin: 0 auto;
      padding: 0 24px 80px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }
    @media (max-width: 1100px) { .grid { grid-template-columns: repeat(3, 1fr); } }
    @media (max-width: 760px)  { .grid { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 480px)  { .grid { grid-template-columns: 1fr; } }

    /* ── Card ────────────────────────────────────────────────────────── */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      padding: 16px;
      display: flex;
      flex-direction: column;
      cursor: pointer;
      transition: border-color 0.12s;
    }
    .card:hover,
    .card.selected { border-color: var(--accent); }

    .card-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }
    .type-badge {
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      background: var(--chip-bg);
      padding: 2px 7px;
    }
    .time-ago {
      font-size: 10px;
      color: var(--muted);
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .card-title {
      font-size: 20px;
      font-weight: 700;
      line-height: 1.15;
      letter-spacing: -0.01em;
      margin-bottom: 8px;
      font-family: Georgia, 'Times New Roman', serif;
      word-break: break-word;
    }
    .card-desc {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.65;
      flex: 1;
    }

    .card-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-top: 12px;
    }
    .tag-chip {
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      background: var(--chip-bg);
      padding: 2px 6px;
    }

    .card-actions {
      display: flex;
      gap: 8px;
      margin-top: 14px;
      align-items: center;
    }
    .btn-pass {
      padding: 6px 12px;
      border: 1px solid var(--accent);
      background: transparent;
      color: var(--accent);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.04em;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
      line-height: 1.4;
    }
    .btn-pass:hover { background: var(--accent-dim); }
    .btn-buy {
      padding: 6px 12px;
      background: var(--black);
      border: 1px solid var(--black);
      color: #fff;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.04em;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
      line-height: 1.4;
    }
    .btn-buy:hover { background: #333; border-color: #333; }

    .card-cta {
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      margin-top: 10px;
    }

    /* ── Modal ───────────────────────────────────────────────────────── */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(20, 18, 16, 0.5);
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.15s;
    }
    .overlay.open {
      opacity: 1;
      pointer-events: all;
    }
    .modal {
      background: var(--card);
      border: 1px solid var(--border);
      max-width: 540px;
      width: 100%;
      max-height: 82vh;
      overflow-y: auto;
      padding: 32px;
      position: relative;
      transform: translateY(8px);
      transition: transform 0.15s;
    }
    .overlay.open .modal { transform: translateY(0); }

    .modal-close {
      position: absolute;
      top: 14px;
      right: 16px;
      background: none;
      border: none;
      font-size: 20px;
      color: var(--muted);
      cursor: pointer;
      line-height: 1;
      padding: 2px 6px;
    }
    .modal-close:hover { color: var(--text); }
    .modal-badge {
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      background: var(--chip-bg);
      padding: 2px 7px;
      display: inline-block;
      margin-bottom: 14px;
    }
    .modal-title {
      font-size: 26px;
      font-weight: 700;
      font-family: Georgia, 'Times New Roman', serif;
      margin-bottom: 10px;
      line-height: 1.2;
    }
    .modal-desc {
      font-size: 14px;
      color: var(--muted);
      line-height: 1.7;
      margin-bottom: 22px;
    }
    .modal-label {
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 5px;
    }
    .modal-body {
      font-size: 13px;
      line-height: 1.7;
      margin-bottom: 20px;
      color: var(--text);
    }
    .modal-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-bottom: 24px;
    }
    .modal-actions {
      display: flex;
      gap: 10px;
    }

    /* ── Empty ───────────────────────────────────────────────────────── */
    .empty {
      grid-column: 1 / -1;
      padding: 64px 0;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
      letter-spacing: 0.04em;
    }

    /* ── Responsive tweaks ───────────────────────────────────────────── */
    @media (max-width: 600px) {
      header, .controls, .grid { padding-left: 12px; padding-right: 12px; }
      header { padding-top: 28px; }
    }
  </style>
</head>
<body>

<header>
  <div class="site-name">µ micro</div>
  <div class="site-sub">one developer tool, shipped every day — zero dependencies, runs with npx</div>
</header>

<div class="controls">
  <input id="search" class="search-input" type="search"
         placeholder="search by name or description..."
         autocomplete="off" spellcheck="false">

  <div class="filter-row">
    <div class="filter-group">
      <span class="filter-label">TYPE</span>
      <div id="type-chips" style="display:flex;flex-wrap:wrap;gap:4px"></div>
    </div>
    <div class="filter-group">
      <span class="filter-label">TAGS</span>
      <div id="tag-chips" style="display:flex;flex-wrap:wrap;gap:4px"></div>
    </div>
  </div>

  <div class="controls-footer">
    <span class="results-count" id="results-count"></span>
    <button class="clear-btn" id="clear-btn">× clear filters</button>
  </div>
</div>

<div class="grid" id="grid"></div>

<!-- Detail modal -->
<div class="overlay" id="overlay">
  <div class="modal" id="modal" role="dialog" aria-modal="true">
    <button class="modal-close" id="modal-close" aria-label="close">×</button>
    <div id="modal-content"></div>
  </div>
</div>

<script>
  // ── State ──────────────────────────────────────────────────────────────────
  let allTools   = [];
  let activeTypes = new Set();
  let activeTags  = new Set();
  let query       = '';

  // ── Field normalisation ────────────────────────────────────────────────────
  // Handle both old schema (category, github_url) and new schema (tool_type, github)
  function typeOf(t) {
    return t.tool_type || t.category || 'classic-cli';
  }
  function githubOf(t) {
    return t.github || t.github_url || null;
  }
  function tagsOf(t) {
    return Array.isArray(t.tags) ? t.tags : [];
  }
  function nameOf(t) {
    return t.slug || t.name || '?';
  }
  function typeLabel(raw) {
    const m = {
      'classic-cli':         'CLI',
      'cli':                 'CLI',
      'interactive-tui':     'TUI',
      'local-web-dashboard': 'DASHBOARD',
      'file-watcher':        'WATCHER',
      'code-generator':      'GENERATOR',
      'developer-tools':     'DEV-TOOLS',
      'developer_tools':     'DEV-TOOLS',
    };
    return m[raw] || raw.replace(/-/g, ' ').toUpperCase();
  }
  function timeAgo(ds) {
    if (!ds) return '';
    const d = Math.round((Date.now() - new Date(ds)) / 86400000);
    if (d <= 0)  return 'TODAY';
    if (d === 1) return '1D AGO';
    return d + 'D AGO';
  }

  // ── Filter logic ───────────────────────────────────────────────────────────
  function matches(t) {
    if (query) {
      const hay = [nameOf(t), t.description || '', t.problem || ''].join(' ').toLowerCase();
      if (!hay.includes(query)) return false;
    }
    if (activeTypes.size && !activeTypes.has(typeOf(t))) return false;
    if (activeTags.size) {
      const tt = tagsOf(t);
      if (![...activeTags].some(tag => tt.includes(tag))) return false;
    }
    return true;
  }

  // ── Render grid ────────────────────────────────────────────────────────────
  function renderGrid() {
    const grid = document.getElementById('grid');
    const visible = allTools.filter(matches);

    const total = allTools.length;
    document.getElementById('results-count').textContent =
      visible.length === total
        ? total + ' tools'
        : visible.length + ' of ' + total + ' tools';

    if (!visible.length) {
      grid.innerHTML = '<div class="empty">no tools match — try clearing the filters</div>';
      return;
    }

    grid.innerHTML = visible.map(t => {
      const tags = tagsOf(t);
      const gh   = githubOf(t);

      const tagsHtml = tags.length
        ? '<div class="card-tags">' +
          tags.map(tag => '<span class="tag-chip">' + tag + '</span>').join('') +
          '</div>'
        : '';

      const passBtn = gh
        ? '<a class="btn-pass" href="' + gh + '" target="_blank" rel="noopener" onclick="event.stopPropagation()">pass →</a>'
        : '<span class="btn-pass" style="opacity:.4;cursor:default">pass →</span>';

      const buyBtn = t.payUrl
        ? '<a class="btn-buy" href="' + t.payUrl + '" target="_blank" rel="noopener" onclick="event.stopPropagation()">buy · $' + Number(t.price).toFixed(2) + ' →</a>'
        : '';

      return '<div class="card" data-slug="' + nameOf(t) + '" onclick="openModal(\'' + nameOf(t) + '\')">' +
        '<div class="card-meta">' +
          '<span class="type-badge">' + typeLabel(typeOf(t)) + '</span>' +
          '<span class="time-ago">' + timeAgo(t.date) + '</span>' +
        '</div>' +
        '<div class="card-title">' + nameOf(t) + '</div>' +
        '<div class="card-desc">' + (t.description || '') + '</div>' +
        tagsHtml +
        '<div class="card-actions">' + passBtn + buyBtn + '</div>' +
        '<div class="card-cta">CLICK FOR DETAILS →</div>' +
      '</div>';
    }).join('');
  }

  // ── Build filter chips (recomputed from current allTools each time) ─────────
  function buildFilters() {
    // Collect all unique types and tags present in the full dataset
    const typeSet = new Set(allTools.map(typeOf));
    const tagSet  = new Set();
    allTools.forEach(t => tagsOf(t).forEach(tag => tagSet.add(tag)));

    const typeWrap = document.getElementById('type-chips');
    const tagWrap  = document.getElementById('tag-chips');

    typeWrap.innerHTML = [...typeSet].sort().map(v =>
      '<span class="chip' + (activeTypes.has(v) ? ' active' : '') + '" data-type="' + v + '">' +
        typeLabel(v) +
      '</span>'
    ).join('');

    tagWrap.innerHTML = [...tagSet].sort().map(v =>
      '<span class="chip' + (activeTags.has(v) ? ' active' : '') + '" data-tag="' + v + '">' +
        v +
      '</span>'
    ).join('');

    typeWrap.querySelectorAll('.chip').forEach(el =>
      el.addEventListener('click', () => {
        const v = el.dataset.type;
        activeTypes.has(v) ? activeTypes.delete(v) : activeTypes.add(v);
        syncClear(); buildFilters(); renderGrid();
      })
    );
    tagWrap.querySelectorAll('.chip').forEach(el =>
      el.addEventListener('click', () => {
        const v = el.dataset.tag;
        activeTags.has(v) ? activeTags.delete(v) : activeTags.add(v);
        syncClear(); buildFilters(); renderGrid();
      })
    );
  }

  function syncClear() {
    const btn = document.getElementById('clear-btn');
    btn.style.display = (activeTypes.size || activeTags.size || query) ? 'inline-block' : 'none';
  }

  // ── Modal ──────────────────────────────────────────────────────────────────
  function openModal(slug) {
    const t = allTools.find(x => nameOf(x) === slug);
    if (!t) return;

    const tags = tagsOf(t);
    const gh   = githubOf(t);

    const tagsHtml = tags.length
      ? '<div class="modal-tags">' +
        tags.map(tag => '<span class="tag-chip">' + tag + '</span>').join('') +
        '</div>'
      : '';

    const passBtn = gh
      ? '<a class="btn-pass" href="' + gh + '" target="_blank" rel="noopener">pass →</a>'
      : '';
    const buyBtn = t.payUrl
      ? '<a class="btn-buy" href="' + t.payUrl + '" target="_blank" rel="noopener">buy · $' + Number(t.price).toFixed(2) + ' →</a>'
      : '';

    function section(label, text) {
      if (!text) return '';
      return '<div class="modal-label">' + label + '</div>' +
             '<div class="modal-body">' + text + '</div>';
    }

    document.getElementById('modal-content').innerHTML =
      '<span class="modal-badge">' + typeLabel(typeOf(t)) + '</span>' +
      '<div class="modal-title">' + nameOf(t) + '</div>' +
      '<div class="modal-desc">' + (t.description || '') + '</div>' +
      section('PROBLEM', t.problem) +
      section('SOLUTION', t.solution) +
      section('HOW IT WORKS', t.method) +
      tagsHtml +
      '<div class="modal-actions">' + passBtn + buyBtn + '</div>';

    document.getElementById('overlay').classList.add('open');
    document.getElementById('modal-close').focus();
  }

  function closeModal() {
    document.getElementById('overlay').classList.remove('open');
  }

  document.getElementById('modal-close').addEventListener('click', closeModal);
  document.getElementById('overlay').addEventListener('click', e => {
    if (e.target === document.getElementById('overlay')) closeModal();
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closeModal();
  });

  // ── Wire up search + clear ─────────────────────────────────────────────────
  document.getElementById('search').addEventListener('input', e => {
    query = e.target.value.trim().toLowerCase();
    syncClear(); renderGrid();
  });

  document.getElementById('clear-btn').addEventListener('click', () => {
    activeTypes.clear(); activeTags.clear();
    query = '';
    document.getElementById('search').value = '';
    syncClear(); buildFilters(); renderGrid();
  });

  // ── Bootstrap ──────────────────────────────────────────────────────────────
  fetch('./tools.json')
    .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(data => {
      allTools = data;
      buildFilters();
      renderGrid();
    })
    .catch(() => {
      document.getElementById('grid').innerHTML =
        '<div class="empty">could not load tools.json — try refreshing</div>';
    });
</script>

</body>
</html>
